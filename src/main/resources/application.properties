spring.application.name=notes-service

# Default profile runs on in-memory H2 so the service is runnable with zero external
# dependencies (no Docker/DB install needed). Postgres is the intended production
# datastore (see README) - swap these 4 lines for the postgres profile when Docker is
# available. H2 here is a time-boxed pragmatic choice, not a reversal of that decision.
spring.datasource.url=jdbc:h2:mem:notes;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Never leak internal error detail (message/stack trace) to API clients - logged
# server-side instead, correlated by trace id. See GlobalExceptionHandler.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.root=INFO
logging.level.com.notes.service=DEBUG
