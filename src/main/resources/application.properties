spring.application.name=notes-service

# ${VAR:default} - every value below is overridable by an environment variable (what a
# container orchestrator injects via ConfigMap/Secret per environment) without touching
# code or rebuilding the image; the literal after the colon is only the local-dev
# fallback. See README "Deployment" for which of these actually change between envs.
server.port=${PORT:8080}

# Default profile runs on in-memory H2 so the service is runnable with zero external
# dependencies (no Docker/DB install needed). Postgres is the intended production
# datastore (see README) - swap these 4 lines for the postgres profile when Docker is
# available. H2 here is a time-boxed pragmatic choice, not a reversal of that decision.
spring.datasource.url=jdbc:h2:mem:notes;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bounded pool + timeouts: one instance's slow/hung query shouldn't exhaust the
# connection pool and starve every other request this instance is handling. Pool size
# is per-instance - it must be sized so (pool size x instance count) stays under
# Postgres's own max_connections, which is exactly the kind of thing that only bites
# you once you've horizontally scaled past one instance. See README "Deployment".
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:2000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Never leak internal error detail (message/stack trace) to API clients - logged
# server-side instead, correlated by trace id. See GlobalExceptionHandler.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.notes.service=${LOG_LEVEL_APP:DEBUG}

# Liveness (process is up) vs readiness (safe to route traffic to) are exposed as
# separate probes - an orchestrator should only stop traffic to a pod on failed
# readiness, and only restart it on failed liveness. See README "Deployment".
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.exposure.include=health,info

# Let in-flight requests finish (bounded wait) instead of being dropped mid-response
# when an instance is terminated during a deploy or scale-down.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
