# Activate with: spring.profiles.active=postgres (after `docker compose up -d` for
# local dev - a real deployment points these at an actual managed Postgres instead).
#
# The local-dev fallback credentials ("notes"/"notes") only work because
# docker-compose.yml creates that exact user - they are not a real secret and must
# never be reused as-is outside local dev. In staging/prod these come from the
# orchestrator's secret store (e.g. a Kubernetes Secret / cloud secrets manager), never
# committed to this file or baked into the container image.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notes}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:notes}
spring.datasource.password=${DB_PASSWORD:notes}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
